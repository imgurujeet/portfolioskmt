<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="avatarBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#241947"/>
      <stop offset="70%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#07080d"/>
    </radialGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312244"/>
      <stop offset="100%" stop-color="#191124"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#avatarBg)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>

  <!-- Hair Back / Ponytail -->
  <path d="M120 180 C110 240, 140 310, 180 320 C160 270, 140 230, 140 180 Z" fill="url(#hairGrad)"/>
  <path d="M280 180 C290 240, 260 310, 220 320 C240 270, 260 230, 260 180 Z" fill="url(#hairGrad)"/>

  <!-- Shoulders & Hoodie -->
  <path d="M100 370 C100 300, 140 280, 200 280 C260 280, 300 300, 300 370 L300 400 L100 400 Z" fill="url(#hoodieGrad)"/>
  
  <!-- Hoodie Collar & Strings -->
  <path d="M165 282 C185 310, 215 310, 235 282 C210 295, 190 295, 165 282 Z" fill="#2e1065"/>
  <line x1="185" y1="298" x2="185" y2="340" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
  <line x1="215" y1="298" x2="215" y2="335" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
  <circle cx="185" cy="343" r="3" fill="#a78bfa"/>
  <circle cx="215" cy="338" r="3" fill="#a78bfa"/>

  <!-- Neck -->
  <path d="M180 240 L180 285 C190 290, 210 290, 220 285 L220 240 Z" fill="#fbcfe8"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="195" rx="60" ry="70" fill="url(#skinGrad)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="160" cy="215" rx="10" ry="6" fill="#f43f5e" opacity="0.25"/>
  <ellipse cx="240" cy="215" rx="10" ry="6" fill="#f43f5e" opacity="0.25"/>

  <!-- Eyes -->
  <ellipse cx="172" cy="195" rx="6" ry="8" fill="#1e1b4b"/>
  <circle cx="174" cy="193" r="2.5" fill="#ffffff"/>
  <circle cx="170" cy="197" r="1.2" fill="#ffffff"/>

  <ellipse cx="228" cy="195" rx="6" ry="8" fill="#1e1b4b"/>
  <circle cx="230" cy="193" r="2.5" fill="#ffffff"/>
  <circle cx="226" cy="197" r="1.2" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M162 180 Q172 176, 182 180" stroke="#4a044e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M218 180 Q228 176, 238 180" stroke="#4a044e" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Cute Nose -->
  <path d="M198 206 Q200 210, 203 209" stroke="#db2777" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Gentle Smile -->
  <path d="M190 225 Q200 234, 210 225" stroke="#be185d" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Stylish Modern Glasses -->
  <rect x="150" y="180" width="42" height="30" rx="8" fill="none" stroke="#a78bfa" stroke-width="2.8"/>
  <rect x="208" y="180" width="42" height="30" rx="8" fill="none" stroke="#a78bfa" stroke-width="2.8"/>
  <line x1="192" y1="192" x2="208" y2="192" stroke="#a78bfa" stroke-width="3"/>
  <line x1="150" y1="190" x2="140" y2="194" stroke="#a78bfa" stroke-width="2.5"/>
  <line x1="250" y1="190" x2="260" y2="194" stroke="#a78bfa" stroke-width="2.5"/>

  <!-- Hair Front: Bangs & Styling -->
  <path d="M140 170 C140 120, 260 120, 260 170 C240 150, 220 155, 200 155 C180 155, 160 150, 140 170 Z" fill="url(#hairGrad)"/>
  <path d="M140 165 C150 190, 160 210, 155 230 C150 215, 145 190, 140 165 Z" fill="url(#hairGrad)"/>
  <path d="M260 165 C250 190, 240 210, 245 230 C250 215, 255 190, 260 165 Z" fill="url(#hairGrad)"/>
  
  <!-- Left Side Bang strand -->
  <path d="M170 155 C180 175, 185 185, 185 190 C180 180, 175 170, 170 155 Z" fill="#231934"/>

  <!-- Modern Creative Headphones -->
  <!-- Band over head -->
  <path d="M136 185 C136 105, 264 105, 264 185" fill="none" stroke="url(#headphoneGrad)" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Earcups -->
  <rect x="130" y="175" width="16" height="36" rx="8" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="254" y="175" width="16" height="36" rx="8" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>

  <!-- Sparkle Accents on Headphones -->
  <circle cx="138" cy="193" r="2" fill="#ffffff"/>
  <circle cx="262" cy="193" r="2" fill="#ffffff"/>

  <!-- Corner Creative Sparkle -->
  <g transform="translate(320, 70)">
    <path d="M0 -12 Q0 0 12 0 Q0 0 0 12 Q0 0 -12 0 Q0 0 0 -12 Z" fill="#a78bfa"/>
  </g>
  <g transform="translate(70, 100)">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#c4b5fd"/>
  </g>
</svg>
